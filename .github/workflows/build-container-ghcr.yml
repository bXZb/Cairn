name: Build And Publish Container

on:
  workflow_dispatch:
    inputs:
      agent:
        description: "Agent CLI baked into the image"
        type: choice
        default: claudecode
        options:
          - claudecode
          - codex
          - pi
  push:
    branches:
      - main
    paths:
      - "container/**"

permissions:
  packages: write

env:
  AGENT: ${{ inputs.agent || 'claudecode' }}

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute lowercase image owner
        run: echo "IMAGE_OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./container
          platforms: linux/amd64
          push: true
          build-args: |
            AGENT=${{ env.AGENT }}
          tags: ghcr.io/${{ env.IMAGE_OWNER_LC }}/cairn-worker-container:latest
          cache-from: type=registry,ref=ghcr.io/${{ env.IMAGE_OWNER_LC }}/cairn-worker-container:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ env.IMAGE_OWNER_LC }}/cairn-worker-container:buildcache,mode=max

      - name: Smoke test agent CLI
        run: |
          docker run --rm -e AGENT ghcr.io/${{ env.IMAGE_OWNER_LC }}/cairn-worker-container:latest \
            bash -c 'case "$AGENT" in
              claudecode) claude --version ;;
              codex) codex --version ;;
              pi) pi --version ;;
              *) echo "unknown AGENT=$AGENT" >&2; exit 1 ;;
            esac'
