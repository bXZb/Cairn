name: Build And Publish Container

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "container/**"

permissions:
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute lowercase image owner
        run: echo "IMAGE_OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./container
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ env.IMAGE_OWNER_LC }}/cairn-worker-container:latest
          cache-from: type=registry,ref=ghcr.io/${{ env.IMAGE_OWNER_LC }}/cairn-worker-container:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ env.IMAGE_OWNER_LC }}/cairn-worker-container:buildcache,mode=max

      - name: Smoke test agent CLIs
        run: |
          docker run --rm ghcr.io/${{ env.IMAGE_OWNER_LC }}/cairn-worker-container:latest \
            bash -c 'claude --version && codex --version && pi --version'
